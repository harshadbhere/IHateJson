<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 92" width="460" height="92" role="img" aria-label="I {Hate} JSON">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="badgeBg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>

    <!-- Refined Border for Badge -->
    <linearGradient id="badgeBorder" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Rose / Crimson Heart Gradient -->
    <linearGradient id="roseLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="roseRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Subtle Glow Filter for Heart Crack -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <style>
      .logo-text-main {
        fill: #0f172a;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 850;
      }
      .logo-bracket {
        fill: #e11d48;
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-weight: 800;
      }
      .logo-hate {
        fill: #e11d48;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 900;
      }
      .logo-json {
        fill: #0284c7;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 900;
      }
      @media (prefers-color-scheme: dark) {
        .logo-text-main { fill: #f8fafc; }
        .logo-json { fill: #38bdf8; }
      }
      :root[data-theme="dark"] .logo-text-main { fill: #f8fafc; }
      :root[data-theme="dark"] .logo-json { fill: #38bdf8; }
    </style>
  </defs>

  <!-- ==================== EMBLEM BADGE (Left) ==================== -->
  <g transform="translate(6, 6)" filter="url(#badgeShadow)">
    <!-- Base Squircle -->
    <rect width="80" height="80" rx="20" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="1.8" />

    <!-- Ambient glow behind heart -->
    <circle cx="40" cy="40" r="24" fill="#e11d48" opacity="0.2" filter="blur(8px)" />

    <!-- Top edge specular highlight -->
    <path d="M 22 4 Q 40 2 58 4" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.2" stroke-linecap="round" fill="none" />

    <!-- Left Bracket '{' inside badge -->
    <path d="M 18 28 C 18 35 14 38 14 40 C 14 42 18 45 18 52 C 18 55 16 56 14 56"
          stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" fill="none" />

    <!-- Right Bracket '}' inside badge -->
    <path d="M 62 28 C 62 35 66 38 66 40 C 66 42 62 45 62 52 C 62 55 64 56 66 56"
          stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" fill="none" />

    <!-- Left Heart Lobe -->
    <path d="M 38 27 C 34 20 24 21 21 29 C 18 38 26 48 37 57 L 37 51 L 33 43 L 39 37 L 35 32 Z"
          fill="url(#roseLeft)" />

    <!-- Right Heart Lobe -->
    <path d="M 42 27 C 46 20 56 21 59 29 C 62 38 54 48 43 57 L 43 51 L 39 43 L 45 37 L 41 32 Z"
          fill="url(#roseRight)" />

    <!-- Neon Lightning Fracture Line -->
    <path d="M 40 25 L 36 33 L 42 37 L 36 44 L 41 50 L 40 59"
          stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)" />

    <circle cx="39" cy="40" r="1.5" fill="#ffffff" />
  </g>

  <!-- ==================== BRAND WORDMARK (Right) ==================== -->
  <g transform="translate(104, 0)">
    <!-- Primary "I" -->
    <text x="0" y="58" class="logo-text-main" font-size="44" font-weight="900" letter-spacing="-0.03em">I</text>

    <!-- Opening Curly Bracket '{' -->
    <text x="32" y="59" class="logo-bracket" font-size="48" font-weight="800">{</text>

    <!-- "Hate" -->
    <text x="62" y="58" class="logo-hate" font-size="44" font-weight="900" letter-spacing="-0.02em">Hate</text>

    <!-- Closing Curly Bracket '}' -->
    <text x="172" y="59" class="logo-bracket" font-size="48" font-weight="800">}</text>

    <!-- "JSON" -->
    <text x="202" y="58" class="logo-json" font-size="44" font-weight="900" letter-spacing="-0.03em">JSON</text>
  </g>
</svg>
